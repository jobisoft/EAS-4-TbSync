<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n-content="services.title"></title>
    <script type="module" src="services.mjs"></script>
    <style>
      :root {
        --bg-page: #fff;
        --bg-card: #fff;
        --bg-input-disabled: #f4f4f6;
        --text-primary: #222;
        --text-secondary: #555;
        --text-tertiary: #666;
        --text-body: #333;
        --border-input: #ccc;
        --border-subtle: #ececee;
        --accent: #2a7fd4;
        --accent-hover: #1a6fc4;
        --btn-secondary-bg: #e5e5e7;
        --error-bg: #ffe0e0;
        --error-accent: #c43b3b;
        --error-text: #7a2222;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-page: #1e1f21;
          --bg-card: #2b2d30;
          --bg-input-disabled: #2a2c2f;
          --text-primary: #e8e9eb;
          --text-secondary: #b3b5ba;
          --text-tertiary: #9498a0;
          --text-body: #d6d8dc;
          --border-input: #4a4d52;
          --border-subtle: #3a3c40;
          --accent: #5fa6e8;
          --accent-hover: #7ab5ec;
          --btn-secondary-bg: #3a3c40;
          --error-bg: #3f1f1f;
          --error-accent: #e66a6a;
          --error-text: #f3a5a5;
        }
      }

      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--text-primary);
        background: var(--bg-page);
        margin: 0;
        padding: 20px 24px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
      }

      .section {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--border-subtle);
      }
      .section:first-of-type {
        margin-top: 6px;
        padding-top: 0;
        border-top: none;
      }
      .section h3 {
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
      }

      .field {
        display: flex;
        flex-direction: column;
        margin-bottom: 10px;
      }
      .field label {
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
      }
      .field input[type="text"],
      .field input[type="url"],
      .field input[type="password"],
      .field input[type="datetime-local"],
      .field textarea,
      .field select {
        padding: 5px 8px;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        font-size: 13px;
        font-family: inherit;
        background: var(--bg-card);
        color: var(--text-primary);
      }
      .field input:disabled,
      .field textarea:disabled,
      .field select:disabled {
        background: var(--bg-input-disabled);
        color: var(--text-tertiary);
      }
      .field .hint {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 4px;
        line-height: 1.4;
      }

      .checkbox-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 6px 0;
      }
      .checkbox-row input {
        margin-top: 2px;
        flex-shrink: 0;
      }
      .checkbox-row .checkbox-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .checkbox-row .label {
        font-size: 13px;
        color: var(--text-body);
      }
      .checkbox-row .hint {
        font-size: 11px;
        color: var(--text-tertiary);
        line-height: 1.4;
      }
      .checkbox-row label {
        margin: 0;
        padding: 0;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
      }
      .actions .right {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }
      button.primary {
        padding: 6px 14px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        padding: 6px 14px;
        background: var(--btn-secondary-bg);
        color: var(--text-primary);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button[hidden] {
        display: none;
      }

      .error {
        margin-top: 10px;
        padding: 8px 12px;
        background: var(--error-bg);
        border-left: 3px solid var(--error-accent);
        color: var(--error-text);
        font-size: 12px;
        border-radius: 3px;
        display: none;
      }
      .error.visible {
        display: block;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h2 data-i18n-content="services.title"></h2>
    <p class="hint" data-i18n-content="services.intro"></p>

    <div class="section">
      <h3 data-i18n-content="services.oof.section"></h3>
      <p class="hint" data-i18n-content="services.oof.intro"></p>

      <!-- Inside the section, under its heading: a service the server does
           not offer still has a name, and saying nothing about it under a
           heading that is not there reads as a broken window. -->
      <div id="error" class="error"></div>
      <div id="loading" class="hint" data-i18n-content="services.loading"></div>

      <div id="form" hidden>
        <div class="field">
          <label for="oof-state" data-i18n-content="services.oof.state"></label>
          <select id="oof-state">
            <option
              value="0"
              data-i18n-content="services.oof.state.off"
            ></option>
            <option
              value="1"
              data-i18n-content="services.oof.state.on"
            ></option>
            <option
              value="2"
              data-i18n-content="services.oof.state.scheduled"
            ></option>
          </select>
        </div>

        <div class="field" id="window-row" hidden>
          <label for="oof-start" data-i18n-content="services.oof.from"></label>
          <input id="oof-start" type="datetime-local" />
          <label for="oof-end" data-i18n-content="services.oof.until"></label>
          <input id="oof-end" type="datetime-local" />
        </div>

        <div class="field" id="internal-row">
          <label
            for="oof-internal"
            data-i18n-content="services.oof.internal"
          ></label>
          <textarea id="oof-internal" rows="5"></textarea>
          <span class="hint" id="oof-internal-hint"></span>
        </div>

        <!-- Hidden wholesale on a server that reports no external audience:
             Exchange 14.1 answers with AppliesToInternal alone, accepts the
             other two without complaint and keeps neither. -->
        <div id="external-block">
          <div class="checkbox-row">
            <input id="oof-external-on" type="checkbox" />
            <span class="checkbox-body">
              <label
                for="oof-external-on"
                class="label"
                data-i18n-content="services.oof.externalOn"
              ></label>
              <span
                class="hint"
                data-i18n-content="services.oof.externalOn.hint"
              ></span>
            </span>
          </div>

          <div class="field" id="external-row" hidden>
            <label
              for="oof-external"
              data-i18n-content="services.oof.external"
            ></label>
            <textarea id="oof-external" rows="5"></textarea>
            <span class="hint" id="oof-external-hint"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <div class="right">
        <button
          id="btn-save"
          class="primary"
          data-i18n-content="services.save"
          disabled
        ></button>
        <button
          id="btn-cancel"
          class="secondary"
          data-i18n-content="services.cancel"
        ></button>
      </div>
    </div>
  </body>
</html>
