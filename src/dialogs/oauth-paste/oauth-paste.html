<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n-content="oauthPaste.title"></title>
    <script type="module" src="oauth-paste.mjs"></script>
    <style>
      :root {
        --bg-page: #fff;
        --bg-card: #fff;
        --bg-input-disabled: #f4f4f6;
        --text-primary: #222;
        --text-secondary: #555;
        --text-tertiary: #666;
        --text-body: #333;
        --border-input: #ccc;
        --border-subtle: #ececee;
        --accent: #2a7fd4;
        --accent-hover: #1a6fc4;
        --btn-secondary-bg: #e5e5e7;
        --error-bg: #ffe0e0;
        --error-accent: #c43b3b;
        --error-text: #7a2222;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-page: #1e1f21;
          --bg-card: #2b2d30;
          --bg-input-disabled: #2a2c2f;
          --text-primary: #e8e9eb;
          --text-secondary: #b3b5ba;
          --text-tertiary: #9498a0;
          --text-body: #d6d8dc;
          --border-input: #4a4d52;
          --border-subtle: #3a3c40;
          --accent: #5fa6e8;
          --accent-hover: #7ab5ec;
          --btn-secondary-bg: #3a3c40;
          --error-bg: #3f1f1f;
          --error-accent: #e66a6a;
          --error-text: #f3a5a5;
        }
      }

      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--text-primary);
        background: var(--bg-page);
        margin: 0;
        padding: 20px 24px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
      }
      p.hint {
        font-size: 12px;
        color: var(--text-tertiary);
        line-height: 1.45;
        margin: 0 0 10px;
      }

      ol.steps {
        margin: 0 0 14px;
        padding-left: 20px;
        font-size: 12px;
        color: var(--text-body);
        line-height: 1.5;
      }
      ol.steps li {
        margin-bottom: 3px;
      }

      .field {
        display: flex;
        flex-direction: column;
        margin-bottom: 10px;
      }
      .field label {
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
      }
      .field textarea {
        padding: 5px 8px;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.4;
        resize: vertical;
        background: var(--bg-card);
        color: var(--text-primary);
      }
      .field textarea:disabled {
        background: var(--bg-input-disabled);
        color: var(--text-tertiary);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
      }
      .actions .right {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }
      button.primary {
        padding: 6px 14px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        padding: 6px 14px;
        background: var(--btn-secondary-bg);
        color: var(--text-primary);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button.link {
        padding: 0;
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        text-decoration: underline;
      }

      .error {
        margin-top: 10px;
        padding: 8px 12px;
        background: var(--error-bg);
        border-left: 3px solid var(--error-accent);
        color: var(--error-text);
        font-size: 12px;
        border-radius: 3px;
        display: none;
      }
      .error.visible {
        display: block;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h2 data-i18n-content="oauthPaste.title"></h2>
    <p class="hint" data-i18n-content="oauthPaste.intro"></p>

    <ol class="steps">
      <li data-i18n-content="oauthPaste.step.signIn"></li>
      <li data-i18n-content="oauthPaste.step.blankPage"></li>
      <li data-i18n-content="oauthPaste.step.paste"></li>
    </ol>

    <div class="field">
      <label for="redirect-url" data-i18n-content="oauthPaste.label"></label>
      <textarea
        id="redirect-url"
        rows="3"
        spellcheck="false"
        autocomplete="off"
        data-i18n-placeholder="oauthPaste.placeholder"
      ></textarea>
    </div>

    <div id="error" class="error"></div>

    <div class="actions">
      <button
        type="button"
        id="btn-reopen"
        class="link"
        data-i18n-content="oauthPaste.button.reopen"
      ></button>
      <div class="right">
        <button
          type="button"
          id="btn-cancel"
          class="secondary"
          data-i18n-content="oauthPaste.button.cancel"
        ></button>
        <button
          type="button"
          id="btn-continue"
          class="primary"
          data-i18n-content="oauthPaste.button.continue"
        ></button>
      </div>
    </div>
  </body>
</html>
