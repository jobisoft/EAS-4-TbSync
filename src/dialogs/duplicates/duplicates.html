<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n-content="duplicates.title"></title>
    <link rel="stylesheet" href="../shared/dialog.css" />
    <script type="module" src="duplicates.mjs"></script>
    <style>
      /* This dialog's own layout. Its colours and the controls drawn
         with them come from `../shared/dialog.css`, which the page
         links first - see the note there. */
      :root {
        /* One place, because the bar's height and the room the page has to
           leave for it have to agree. */
        --actionbar-height: 52px;
      }
      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--text-primary);
        background: var(--bg-page);
        margin: 0;
        padding: 20px 24px calc(var(--actionbar-height) + 12px);
      }
      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
      }

      .section {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--border-subtle);
      }
      .section:first-of-type {
        margin-top: 6px;
        padding-top: 0;
        border-top: none;
      }
      .section h3 {
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
      }

      .field {
        display: flex;
        flex-direction: column;
        margin-bottom: 10px;
      }
      .field label {
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
      }
      .field input[type="text"],
      .field input[type="url"],
      .field input[type="password"],
      .field input[type="datetime-local"],
      .field textarea,
      .field select {
        padding: 5px 8px;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        font-size: 13px;
        font-family: inherit;
        background: var(--bg-card);
        color: var(--text-primary);
      }
      .field input:disabled,
      .field textarea:disabled,
      .field select:disabled {
        background: var(--bg-input-disabled);
        color: var(--text-tertiary);
      }
      .field .hint {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 4px;
        line-height: 1.4;
      }

      .checkbox-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 6px 0;
      }
      .checkbox-row input {
        margin-top: 2px;
        flex-shrink: 0;
      }
      .checkbox-row .checkbox-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .checkbox-row .label {
        font-size: 13px;
        color: var(--text-body);
      }
      .checkbox-row .hint {
        font-size: 11px;
        color: var(--text-tertiary);
        line-height: 1.4;
      }
      .checkbox-row label {
        margin: 0;
        padding: 0;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        box-sizing: border-box;
        min-height: var(--actionbar-height);
      }
      .actions .right {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }

      .error {
        margin-top: 10px;
        padding: 8px 12px;
        background: var(--error-bg);
        border-left: 3px solid var(--error-accent);
        color: var(--error-text);
        font-size: 12px;
        border-radius: 3px;
        display: none;
      }
      .error.visible {
        display: block;
      }

      [hidden] {
        display: none !important;
      }
    </style>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      thead th {
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
        border-bottom: 1px solid var(--border-subtle);
        padding: 0 8px 6px 0;
      }
      tbody td {
        padding: 6px 8px 6px 0;
        border-bottom: 1px solid var(--border-subtle);
        color: var(--text-body);
        vertical-align: top;
      }
      td.uid {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: var(--text-tertiary);
        word-break: break-all;
      }
      td.copies,
      th.copies {
        text-align: right;
        white-space: nowrap;
      }
      /* Wide content - a long UID - scrolls sideways in its own box, so
         the page itself never does. */
      .scroll {
        overflow-x: auto;
        margin-top: 10px;
      }

      /* The buttons are pinned to the bottom of the window and everything
         else scrolls under them: with one row per duplicated item, a
         mailbox that needs this window at all pushes them off the bottom
         otherwise. The bar paints the page background so rows passing
         beneath it disappear cleanly, and the body reserves its height so
         the last row can still be scrolled clear of it. */
      .actions {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 24px;
        margin-top: 0;
        background: var(--bg-page);
        border-top: 1px solid var(--border-subtle);
      }
      .col-check {
        width: 28px;
      }
    </style>
  </head>
  <body>
    <h2 data-i18n-content="duplicates.title"></h2>
    <p class="hint" data-i18n-content="duplicates.intro"></p>

    <div id="error" class="error"></div>
    <div id="loading" class="hint" data-i18n-content="duplicates.loading"></div>

    <div id="content" hidden>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th class="col-check">
                <input
                  type="checkbox"
                  id="check-all"
                  data-i18n-title="duplicates.column.selectAll"
                />
              </th>
              <th data-i18n-content="duplicates.column.calendar"></th>
              <th data-i18n-content="duplicates.column.item"></th>
              <th data-i18n-content="duplicates.column.uid"></th>
              <th
                class="copies"
                data-i18n-content="duplicates.column.copies"
              ></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <p class="hint" data-i18n-content="duplicates.footnote"></p>

      <div class="actions">
        <div id="progress" class="hint" hidden></div>
        <div class="right">
          <button
            type="button"
            id="btn-close"
            class="secondary"
            data-i18n-content="duplicates.button.later"
          ></button>
          <button
            type="button"
            id="btn-delete"
            class="primary"
            data-i18n-content="duplicates.button.delete"
          ></button>
        </div>
      </div>
    </div>
  </body>
</html>
